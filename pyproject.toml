[project]
name = "pdf-audiobook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "google-genai>=2.34.0",
    "gtts>=2.5.4",
    "pymupdf>=2.1",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "streamlit>=1.66.1",
]

[project.scripts]
pdf-audiobook = "pdf_audiobook:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
